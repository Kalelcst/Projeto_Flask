{% extends "base.html" %}

{% block head %}

<title>Cadastro</title>
{% endblock %}

{% block body %}

<div class="content">

```
<h1>Criar Conta</h1>

<div class="form">
    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="text"
            name="name"
            placeholder="Nome"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Senha"
            required
        >

        <button type="submit">
            Cadastrar
        </button>

    </form>
</div>

<p style="text-align: center;">Já possui conta?</p>
<p style="text-align: center;">
    <a href="/login">Fazer login</a>
</p>
