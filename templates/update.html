{% extends "base.html" %}

{% block head %}
<title>Controlador de Tarefas</title>
{% endblock %}

{% block body %}
<div class="content">

    <h1 class="title">Atualizar tarefa</h1>

    <div class="form">

        <form action="/update/{{ task.id }}" method="POST">

            <label for="content">Atualizar tarefa:</label>

            <input type="text" name="content" id="content"value="{{ task.content }}" placeholder="Digite a tarefa" required>

            <input type="submit" value="Atualize" >

        </form>

    </div>
</div>
{% endblock %}
