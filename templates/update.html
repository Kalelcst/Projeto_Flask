{% extends "base.html" %}

{% block head %}
<title>Atualizar Tarefa</title>
{% endblock %}

{% block body %}
<div class="content">

    <h1>✏ Atualizar tarefa</h1>

    <div class="form">
        <form action="/update/{{ task.id }}" method="POST">

            <input
                type="text"
                name="content"
                id="content"
                value="{{ task.content }}"
                placeholder="Digite a tarefa"
                required
            >

            <input type="submit" value="Salvar alteração">

        </form>
    </div>

    <br>
    <a href="/">Voltar</a>

</div>
{% endblock %}
