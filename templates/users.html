{% extends "base.html" %}

{% block head %}
<title>Usuários</title>
{% endblock %}

{% block body %}
<div class="content">

    <h1 style="text-align: center">Usuários</h1>
    <div class="form">
        <form action="/users" method="POST">

        <div class="form-row">
            <label for="name">Nome</label>
            <input type="text" id="name" name="name" placeholder="Digite o nome" required>
        </div>

        <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Digite o email" required>
        </div>

        </form>
    </div>

    {% if users|length < 1 %}
        <h4>Nenhum usuário cadastrado.</h4>
    {% else %}

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Ações</th>
            </tr>
        </thead>

        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user.name }}</td>
                <td>{{ user.email }}</td>
                <td>
                    <a href="/user/delete/{{ user.id }}">Excluir</a>
                    <br>
                    <a href="/user/update/{{ user.id }}">Atualizar</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    {% endif %}

</div>
{% endblock %}
