{% extends "base.html" %}

{% block head %}
<title>Login</title>
{% endblock %}

{% block body %}
<div class="content">

    <h1>Login</h1>

    <div class="form">
        <form action="/login" method="POST">

            <input type="email" name="email" placeholder="Digite seu email" required>

            <input type="password" name="password" placeholder="Digite sua senha" required>

            <input type="submit" value="Entrar">

        </form>
    </div>

</div>
{% endblock %}
